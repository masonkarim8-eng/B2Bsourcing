name = "zjseating"
main = "worker/index.js"
compatibility_date = "2026-11-25"

[assets]
directory = "./dist"
binding = "ASSETS"

# Inquiry emails go to Mason's verified Email Routing destination.
[[send_email]]
name = "SEND_EMAIL"
destination_address = "masonkarim8@gmail.com"

# Ask ZJ chatbot model (Workers AI)
[ai]
binding = "AI"

# Ask ZJ chatbot: 20 messages per minute per visitor IP
[[ratelimits]]
name = "CHAT_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Secret set in Cloudflare, not in this file: TURNSTILE_SECRET
